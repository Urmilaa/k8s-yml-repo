apiVersion: v1
kind: Pod
metadata:
  name: redis-secret
spec:
  containers:
  - name: redis
    image: redis

    env:
    - name: SECRET_USERNAME
      valueFrom:
        secretKeyRef:
          name: my-secret
          key: username

    - name: SECRET_PASSWORD
      valueFrom:
        secretKeyRef:
          name: my-secret
          key: password
