apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replicas
  namespace: k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
