apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python
  template:
    metadata:
      labels:
        app: python
    spec:
      containers:
      - name: python
        image: hashicorp/http-echo:1.0
        args:
        - "-text=Hello from Kubernetes LoadBalancer"
        ports:
        - containerPort: 5678
